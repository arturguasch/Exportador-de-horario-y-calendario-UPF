<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">

  <title>Exportador d'horari i calendari UPF</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #65728a;
      --primary: #1457d9;
      --border: #d9e0ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lang-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eaf0ff;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .features {
      display: grid;
      gap: 12px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      background: #fbfcff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .section h2 {
      margin-top: 0;
    }

    .section h3 {
      margin-top: 24px;
    }

    .notice {
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff8e8;
      border: 1px solid #f0dca0;
      font-size: 0.95rem;
    }

    .footer {
      color: var(--muted);
      font-size: 0.95rem;
    }

    a { color: var(--primary); }

    code {
      background: #eef2f8;
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>

    function detectLang() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("lang");
      if (fromUrl && I18N[fromUrl]) return fromUrl;
      const saved = localStorage.getItem("upf-site-lang");
      if (saved && I18N[saved]) return saved;
      const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
      return I18N[browser] ? browser : "en";
    }

    function applyLang(lang) {
      const strings = I18N[lang] || I18N.ca;
      document.documentElement.lang = lang;
      document.title = strings.pageTitle;

      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        if (!strings[key]) return;
        node.innerHTML = strings[key];
      });

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-lang") === lang);
      });

      localStorage.setItem("upf-site-lang", lang);
    }

    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
    });

    applyLang(detectLang());
  </script>
